<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetriminó</title>
<style>
:root{--bg:#f4f1ea;--fg:#1f1d1a;--card:#fff;--line:#d8d2c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--fg:#f1ede4;--card:#262420;--line:#3b3832}}
:root[data-theme="dark"]{--bg:#1b1a18;--fg:#f1ede4;--card:#262420;--line:#3b3832}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:22px;margin:4px 0;letter-spacing:.5px}
.bar{display:flex;gap:14px;font-size:14px;margin-bottom:6px;flex-wrap:wrap;justify-content:center;align-items:center}
canvas{width:min(78vw,300px);height:auto;background:var(--card);border:2px solid var(--line);border-radius:10px}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;width:min(92vw,340px)}
button{font-size:20px;padding:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);touch-action:manipulation;cursor:pointer}
button:active{transform:scale(.94)}
#go{margin-top:8px;font-size:15px;padding:10px 26px;background:#3e8ef7;color:#fff;border:0}
#btnRank{margin-top:8px;font-size:15px;padding:10px 26px;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn-group { display: flex; gap: 10px; }
p{font-size:12px;opacity:.7;margin:8px 0 0;text-align:center;max-width:320px}

/* Estilos do Placar */
#rankBoard {
  display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
  background:var(--card); color:var(--fg); border:2px solid var(--line); 
  border-radius:12px; padding:20px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  width:260px; text-align:center;
}
#rankBoard h2 { margin:0 0 10px 0; font-size:20px; }
#rankBoard ol { padding-left:25px; text-align:left; font-size:16px; margin-bottom:20px; }
#rankBoard li { margin-bottom: 6px; font-weight: bold; }
#rankBoard button { font-size:15px; padding:10px; width:100%; background:#e5484d; color:#fff; border:none; }
</style>
</head>
<body>
<h1>Tetriminó</h1>
<div class="bar"><span>Pontos: <b id="sc">0</b></span><span>Rank: <b id="rk">Iniciante</b></span><span>Próxima: <canvas id="nc" width="84" height="40" style="width:84px;height:40px;border:0;background:none;border-radius:0;vertical-align:middle"></canvas></span></div>
<canvas id="c" width="280" height="480"></canvas>
<div class="ctl">
<button id="bl">◀</button><button id="br">▶</button><button id="bro">⟳</button><button id="bd">▼</button><button id="bh">⤓</button>
</div>
<div class="btn-group">
  <button id="go">Jogar</button>
  <button id="btnRank">Placar Online</button>
</div>
<p>Encoste duas peças com a mesma quantidade de pontos (lado a lado ou uma em cima da outra) e elas somem inteiras. Combos valem mais!</p>

<div id="rankBoard">
  <h2>Top Global</h2>
  <ol id="rankList"></ol>
  <button onclick="document.getElementById('rankBoard').style.display='none'">Fechar Placar</button>
</div>

<audio id="bgm" loop src="tetris.mp3"></audio>

<script>
// NOVAS CHAVES DO DREAMLO CONFIGURADAS:
const DREAMLO_PUBLIC = "6ac4f8798f40bb15a8cf5521";
const DREAMLO_PRIVATE = "37a6eyeTt0ezA3ROZSCH8w2iHzT-T_REWhMSzuz8hj6g";

// Array COL alterado para preto (#111111) e fundo IV ajustado para branco pérola (#f9f9f9)
const W=7,H=12,C=40,FD=260,GD=240,COL=['','#111111','#111111','#111111','#111111','#111111','#111111'];
const IV='#f9f9f9',P={1:[[.5,.5]],2:[[.27,.27],[.73,.73]],3:[[.27,.27],[.5,.5],[.73,.73]],4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],5:[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],6:[[.27,.5],[.73,.5],[.5,.27],[.5,.73]]};
const cv=document.getElementById('c'),x=cv.getContext('2d'),T=()=>performance.now();
const RANKS = ['Iniciante', 'Aprendiz', 'Amador', 'Intermediário', 'Avançado', 'Especialista', 'Mestre', 'Grão-Mestre', 'Lenda'];
let g,d,ay,uid=0,p,nx,score=0,lvl=1,over=true,played=false,busy=false,flash=null,flashT=0,fallT=0,lastJunkScore=0;
const rnd=()=>1+Math.floor(Math.random()*5),newP=()=>({a:rnd(),b:rnd()});
const grid=v=>Array.from({length:H},()=>Array(W).fill(v));
function init(){g=grid(0);d=grid(0);ay=grid(0);}
function cells(q){const{x,y,o,a,b}=q;
 return o==0?[[x,y,a],[x+1,y,b]]:o==1?[[x,y,a],[x,y+1,b]]:o==2?[[x,y,b],[x+1,y,a]]:[[x,y,b],[x,y+1,a]];}
const ok=cs=>cs.every(([cx,cy])=>cx>=0&&cx<W&&cy>=0&&cy<H&&!g[cy][cx]);

async function atualizarPlacar() {
  const lista = document.getElementById('rankList');
  lista.innerHTML = '<li>Carregando...</li>';
  try {
    const res = await fetch(`https://www.dreamlo.com/lb/${DREAMLO_PUBLIC}/json`);
    const data = await res.json();
    const placar = data.dreamlo.leaderboard.entry;
    let html = '';
    if (placar) {
      const entradas = Array.isArray(placar) ? placar : [placar];
      entradas.slice(0, 5).forEach(x => { html += `<li>${x.name} - ${x.score}</li>`; });
    }
    lista.innerHTML = html || '<li>Nenhum recorde online</li>';
  } catch (e) {
    lista.innerHTML = '<li>Erro ao carregar o placar.</li>';
  }
}

function start(){init();score=0;lvl=1;over=false;played=true;busy=false;flash=null;lastJunkScore=0;nx=newP();document.getElementById('bgm').play().catch(()=>{});spawn();}

function spawn(){
 p={...nx,x:2,y:0,o:0,vx:2,vy:-1.2};
 let currentDecade = Math.floor(score / 10);
 if(currentDecade > lastJunkScore) {
  lastJunkScore = currentDecade;
  let present = new Set();
  for(let y=0;y<H;y++)for(let c=0;c<W;c++) if(g[y][c]) present.add(g[y][c]);
  let missing = [1,2,3,4,5].filter(v => !present.has(v));
  if(missing.length > 0) {
   let a = missing[Math.floor(Math.random()*missing.length)];
   let b = missing.length > 1 ? missing[Math.floor(Math.random()*missing.length)] : a;
   nx = {a: a, b: b};
  } else {
   nx = {a: 6, b: 6};
  }
 } else {
  nx=newP();
 }
 if(!ok(cells(p))){
  over=true;p=null;document.getElementById('bgm').pause();
  setTimeout(async () => {
    if(score > 0) {
      let nome = prompt("Fim de Jogo! Qual seu nome para o placar online?", "Gustavo");
      if(nome) {
        let nomeFormatado = encodeURIComponent(nome.substring(0,12).replace(/[^a-zA-Z0-9 ]/g, '').trim());
        if(!nomeFormatado) nomeFormatado = "Anonimo";
        
        document.getElementById('rankBoard').style.display='block';
        document.getElementById('rankList').innerHTML = '<li>Enviando pontuação...</li>';
        try {
          await fetch(`https://www.dreamlo.com/lb/${DREAMLO_PRIVATE}/add/${nomeFormatado}/${score}`);
          atualizarPlacar();
        } catch(e) {
          document.getElementById('rankList').innerHTML = '<li>Erro ao enviar.</li>';
        }
      }
    }
  }, 250);
 }
 upd();
}

function upd(){
 sc.textContent=score;
 rk.textContent=RANKS[Math.min(RANKS.length-1, Math.floor(score/30))];
 drawNext();
 document.getElementById('go').textContent=over?'Jogar':'Reiniciar';
}
function move(dx,dy){if(over||busy||!p)return false;const n={...p,x:p.x+dx,y:p.y+dy};if(ok(cells(n))){p=n;return true}return false;}
function rot(){if(over||busy||!p)return;for(const k of[0,-1,1]){const n={...p,o:(p.o+1)%4,x:p.x+k};if(ok(cells(n))){p=n;return}}}
function tick(){if(!move(0,1))lock();}
function soft(){if(!over&&!busy&&p)tick();}
function drop(){if(over||busy||!p)return;while(move(0,1));lock();}
function lock(){const v=cells({...p,x:p.vx,y:p.vy});uid++;
 cells(p).forEach(([cx,cy,val],i)=>{g[cy][cx]=val;d[cy][cx]=uid;ay[cy][cx]=Math.max(-12,v[i][1]-cy);});
 fallT=T();p=null;busy=true;resolve(1);}
function find(){const m=new Set();
 for(let y=0;y<H;y++)for(let c=0;c<W;c++){const v=g[y][c];if(!v)continue;
  if(c+1<W&&g[y][c+1]==v&&d[y][c+1]!=d[y][c]){m.add(y*W+c);m.add(y*W+c+1);}
  if(y+1<H&&g[y+1][c]==v&&d[y+1][c]!=d[y][c]){m.add(y*W+c);m.add((y+1)*W+c);}}
 return m;}
function resolve(m){const f=find();
 if(f.size){const ids=new Set();f.forEach(i=>ids.add(d[Math.floor(i/W)][i%W]));for(let y=0;y<H;y++)for(let c=0;c<W;c++)if(g[y][c]&&ids.has(d[y][c]))f.add(y*W+c);}
 if(!f.size){busy=false;spawn();return;}
 flash=f;flashT=T();
 setTimeout(()=>{f.forEach(i=>{g[Math.floor(i/W)][i%W]=0;d[Math.floor(i/W)][i%W]=0;});score+=f.size*10*m;lvl=1+Math.floor(score/300);flash=null;upd();
  for(let c=0;c<W;c++){const col=[];for(let y=H-1;y>=0;y--)if(g[y][c])col.push([g[y][c],d[y][c],y]);
   for(let y=H-1,i=0;y>=0;y--,i++){g[y][c]=col[i]?col[i][0]:0;d[y][c]=col[i]?col[i][1]:0;ay[y][c]=col[i]?col[i][2]-y:0;}}
  fallT=T();setTimeout(()=>resolve(m+1),GD);},FD);}
function tile(c,ox,oy,s,v,fl){c.fillStyle=fl?'#ffd54a':IV;c.beginPath();c.roundRect(ox+2,oy+2,s-4,s-4,6);c.fill();c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=1;c.stroke();
 if(v){c.fillStyle=COL[v];P[v].forEach(([a,b])=>{c.beginPath();c.arc(ox+2+a*(s-4),oy+2+b*(s-4),(s-4)*.1,0,7);c.fill();});}}
function seam(cs){const[a,b]=cs,hz=a[1]==b[1],mx=Math.min(a[0],b[0]),my=Math.min(a[1],b[1]);
 x.fillStyle=IV;x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=2;x.beginPath();
 if(hz){x.fillRect((mx+1)*C-4,my*C+3,8,C-6);x.moveTo((mx+1)*C,my*C+8);x.lineTo((mx+1)*C,my*C+C-8);}
 else{x.fillRect(mx*C+3,(my+1)*C-4,C-6,8);x.moveTo(mx*C+8,(my+1)*C);x.lineTo(mx*C+C-8,(my+1)*C);}
 x.stroke();}
function drawNext(){const c=document.getElementById('nc').getContext('2d');c.clearRect(0,0,84,40);if(!nx)return;tile(c,0,0,40,nx.a);tile(c,42,0,40,nx.b);}
function frame(){
 if(p){p.vx+=(p.x-p.vx)*.4;p.vy+=(p.y-p.vy)*.35;}
 const t=T();x.clearRect(0,0,W*C,H*C);
 x.strokeStyle='rgba(128,128,128,.15)';for(let i=1;i<W;i++){x.beginPath();x.moveTo(i*C,0);x.lineTo(i*C,H*C);x.stroke();}
 const fe=Math.min(1,(t-fallT)/GD),mult=Math.pow(1-fe,3),fp=flash?Math.min(1,(t-flashT)/FD):0,still=!flash&&fe>=1;
 for(let y=0;y<H;y++)for(let c=0;c<W;c++){const v=g[y][c];if(!v)continue;const yy=y+ay[y][c]*mult;
  if(flash&&flash.has(y*W+c)){const cx=c*C+C/2,cy=yy*C+C/2,s=1-fp*.85;x.save();x.translate(cx,cy);x.rotate(fp*.35);x.scale(s,s);x.translate(-cx,-cy);tile(x,c*C,yy*C,C,v,true);x.restore();}
  else tile(x,c*C,yy*C,C,v,false);}
 if(still)for(let y=0;y<H;y++)for(let c=0;c<W;c++){if(!g[y][c])continue;if(c+1<W&&d[y][c+1]==d[y][c])seam([[c,y],[c+1,y]]);if(y+1<H&&d[y+1][c]==d[y][c])seam([[c,y],[c,y+1]]);}
 if(p){const cs=cells({...p,x:p.vx,y:p.vy});cs.forEach(([cx,cy,v])=>tile(x,cx*C,cy*C,C,v,false));seam(cs);}
 if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W*C,H*C);x.textAlign='center';x.textBaseline='middle';
  if(!played){for(let i=1;i<=5;i++)tile(x,30+(i-1)*44,H*C/2-120+Math.sin(t/350+i)*5,44,i);
   x.fillStyle='#fff';x.font='800 40px system-ui';x.fillText('Tetriminó',W*C/2,H*C/2-10);x.font='15px system-ui';x.fillText('Toque em Jogar',W*C/2,H*C/2+30);}
  else{x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText('Fim de jogo!',W*C/2,H*C/2-14);x.font='16px system-ui';x.fillText(score+' pontos',W*C/2,H*C/2+20);}}
 requestAnimationFrame(frame);}
function loop(){
 if(!over&&!busy&&p)tick();
 let speed = 650;
 if (score >= 35) speed = Math.max(150, 420 - (score - 35) * 2.5);
 else speed = Math.max(150, 650 - lvl*40);
 setTimeout(loop, speed);
}
function hold(el,fn,rep){let a,b;const stop=()=>{clearTimeout(a);clearInterval(b)};
 el.addEventListener('pointerdown',e=>{e.preventDefault();fn();if(rep)a=setTimeout(()=>{b=setInterval(fn,75)},170);});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));}
hold(bl,()=>move(-1,0),1);hold(br,()=>move(1,0),1);hold(bd,soft,1);hold(bro,rot);hold(bh,drop);

document.getElementById('btnRank').onclick = () => {
  atualizarPlacar();
  document.getElementById('rankBoard').style.display='block';
};
document.getElementById('go').onclick=start;

addEventListener('keydown',e=>{const k=e.key;
 if(k=='ArrowLeft')move(-1,0);else if(k=='ArrowRight')move(1,0);else if(k=='ArrowUp')rot();else if(k=='ArrowDown')soft();else if(k==' '){e.preventDefault();drop()}});
init();atualizarPlacar();frame();loop();
</script>
</body>
</html>
